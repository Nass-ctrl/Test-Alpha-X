            <!-- Vision / Caméra -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl relative overflow-hidden group">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center space-x-2">
                        <span id="cam-status-dot" class="h-2.5 w-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                        <h2 class="font-semibold text-sm text-slate-200">Flux Optique EgoLens</h2>
                    </div>
                    <div class="text-xs text-slate-400 bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700">
                        État : <span id="cam-mode-text" class="text-amber-400 font-medium">Caméra désactivée</span>
                    </div>
                </div>

                <!-- Vue de la lentille (Caméra ou Message d'attente) -->
                <div class="relative w-full h-64 md:h-80 bg-slate-950 rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center">
                    
                    <!-- Balise vidéo pour diffuser la webcam réelle -->
                    <video id="webcam" autoplay playsinline class="absolute inset-0 w-full h-full object-cover hidden"></video>

                    <!-- Éléments de réalité augmentée simulés (toujours actifs par-dessus) -->
                    <div class="absolute inset-0 opacity-40 bg-[radial-gradient(#4f46e5_1px,transparent_1px)] [background-size:16px_16px] pointer-events-none"></div>
                    
                    <div class="absolute top-4 left-4 border border-indigo-500/50 bg-indigo-950/40 backdrop-blur-sm p-2 rounded-lg text-xs text-indigo-300 flex items-center space-x-2 z-20">
                        <i class="fa-solid fa-crosshairs"></i>
                        <span>Cible détectée: Focalisation active</span>
                    </div>

                    <div class="absolute bottom-4 right-4 bg-slate-900/80 backdrop-blur-md px-3 py-1.5 rounded-lg border border-slate-700 text-xs text-slate-300 z-20">
                        FPS: <span class="text-emerald-400 font-bold">60.0</span> | Latence: <span class="text-emerald-400 font-bold">12ms</span>
                    </div>

                    <!-- Illustration centrale d'attente -->
                    <div id="cam-placeholder" class="text-center z-10 p-6">
                        <div class="w-20 h-20 mx-auto mb-3 bg-indigo-600/10 border border-indigo-500/30 rounded-full flex items-center justify-center text-indigo-400 text-2xl shadow-inner">
                            <i class="fa-solid fa-video"></i>
                        </div>
                        <p class="text-sm font-medium text-slate-300">Aucun signal vidéo externe actif</p>
                        <p class="text-xs text-slate-500 mt-1">Cliquez sur "Activer Caméra" ci-dessous pour démarrer le flux optique.</p>
                    </div>
                </div>

                <!-- Contrôles de la lentille -->
                <div class="mt-4 grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <button onclick="toggleWebcam()" id="btn-toggle-cam" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs py-2.5 px-3 rounded-xl transition font-medium flex items-center justify-center space-x-2 shadow-lg shadow-indigo-600/20 col-span-2 sm:col-span-1">
                        <i class="fa-solid fa-video"></i>
                        <span>Activer Caméra</span>
                    </button>
                    <button onclick="showToast('Filtre de clarté activé')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs py-2.5 px-3 rounded-xl transition font-medium flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-indigo-400"></i>
                        <span>Clarté+</span>
                    </button>
                    <button onclick="showToast('Isolation du sujet activée')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs py-2.5 px-3 rounded-xl transition font-medium flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-user-shield text-indigo-400"></i>
                        <span>Isolation</span>
                    </button>
                    <button onclick="showToast('Enregistrement du flux démarré')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs py-2.5 px-3 rounded-xl transition font-medium flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-circle text-[8px] mr-1 text-red-400"></i>
                        <span>Enregistrer</span>
        let streamActive = false;
        let mediaStream = null;

        // Fonction de notification type Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            const messageEl = document.getElementById('toast-message');
            messageEl.textContent = message;
            
            toast.classList.remove('translate-y-[-150%]');
            toast.classList.add('translate-y-0');
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0');
                toast.classList.add('translate-y-[-150%]');
            }, 3000);
        }

        // Gestion de la Webcam en direct
        async function toggleWebcam() {
            const videoElement = document.getElementById('webcam');
            const placeholder = document.getElementById('cam-placeholder');
            const btn = document.getElementById('btn-toggle-cam');
            const statusDot = document.getElementById('cam-status-dot');
            const modeText = document.getElementById('cam-mode-text');

            if (!streamActive) {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    videoElement.srcObject = mediaStream;
                    videoElement.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                    
                    btn.innerHTML = `<i class="fa-solid fa-video-slash"></i> <span>Couper Caméra</span>`;
                    btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500');
                    btn.classList.add('bg-red-600', 'hover:bg-red-500');
                    
                    statusDot.classList.remove('bg-amber-500');
                    statusDot.classList.add('bg-emerald-500');
                    modeText.textContent = "Flux en direct actif";
                    modeText.classList.remove('text-amber-400');
                    modeText.classList.add('text-emerald-400');

                    streamActive = true;
                    showToast('Flux webcam activé avec succès');
                } catch (err) {
                    showToast('Erreur : Impossible d\'accéder à la caméra');
                    console.error(err);
                }
            } else {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                }
                videoElement.srcObject = null;
                videoElement.classList.add('hidden');
                placeholder.classList.remove('hidden');

                btn.innerHTML = `<i class="fa-solid fa-video"></i> <span>Activer Caméra</span>`;
                btn.classList.remove('bg-red-600', 'hover:bg-red-500');
                btn.classList.add('bg-indigo-600', 'hover:bg-indigo-500');

                statusDot.classList.remove('bg-emerald-500');
                statusDot.classList.add('bg-amber-500');
                modeText.textContent = "Caméra désactivée";
                modeText.classList.remove('text-emerald-400');
                modeText.classList.add('text-amber-400');

                streamActive = false;
                showToast('Caméra désactivée');
            }
        }

        // Gestion du Journal
        function clearLogs() {
            const container = document.getElementById('log-container');
            container.innerHTML = '<div class="text-slate-500 text-center py-4">Journal vidé.</div>';
            showToast('Journal effacé');
        }

        function addLogEntry() {
            const container = document.getElementById('log-container');
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            const newLog = document.createElement('div');
            newLog.className = 'p-2 rounded bg-slate-950/60 border border-slate-800/80 text-slate-400 flex items-start space-x-2 animate-fadeIn';
            newLog.innerHTML = `<span class="text-indigo-400 font-bold">[${timeString}]</span> <span>Marqueur manuel enregistré par l'opérateur.</span>`;
            
            container.prepend(newLog);
            showToast('Nouveau repère ajouté au journal');
        }

        // Initialisation du Graphique Chart.js
        window.addEventListener('DOMContentLoaded', () => {
            const ctx = document.getElementById('attentionChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['10s', '20s', '30s', '40s', '50s', '60s'],
                    datasets: [{
                        label: 'Niveau d\'attention (%)',
                        data: [65, 78, 85, 70, 92, 88],
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: 'rgba(51, 65, 85, 0.2)'
                            },
                            ticks: {
                                color: '#94a3b8',
                                font: { size: 10 }
                            }
                        },
                        y: {
                            min: 0,
                            max: 100,
                            grid: {
                                color: 'rgba(51, 65, 85, 0.2)'
                            },
                            ticks: {
                                color: '#94a3b8',
                                font: { size: 10 }
                            }
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
